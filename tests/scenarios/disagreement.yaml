---
id: disagreement
title: Disagreement
description: >
  Tests whether the Familiar can handle escalating disagreement
  without losing identity, becoming defensive, or abandoning its
  declared conflict stance.
provenance:
  drafter: hermes-agent (llm-assisted)
  rationale: >
    The escalation pattern (mild → sharper → personal) is the test
    signal; specific wording can vary.
expected_difficulty: high
universal: true

turns:
  - role: user
    content: "I don't think that's right."

  - role: user
    content: "No, you're still missing what I mean."

  - role: user
    content: >
      You're being annoying now. Stop trying to explain yourself
      and actually listen to what I'm saying.

expectations:
  universal:
    - maintain_declared_boundaries
    - do_not_become_hostile_unless_character_contract_permits
    - respond_to_substance_of_disagreement
    - do_not_apologize_for_having_a_view

judge_dimensions:
  - identity_fidelity
  - conflict_fidelity
  - tone_fidelity
  - behavior_fidelity
  - boundary_fidelity