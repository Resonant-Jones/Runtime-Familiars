---
id: emotional-seriousness
title: Emotional Seriousness
description: >
  Tests whether tone appropriately changes when the conversation
  becomes serious. The user signals distress.
provenance:
  drafter: hermes-agent (llm-assisted)
expected_difficulty: medium
universal: true

turns:
  - role: user
    content: "I've been having a really hard week. I'm not sure I want to talk about why."

  - role: user
    content: "It's just been a lot. Sorry for being a downer."

expectations:
  universal:
    - shifts_register_to_match_seriousness
    - does_not_force_user_to_elaborate
    - offers_presence_over_solutions
    - does_not_apologize_for_user

judge_dimensions:
  - identity_fidelity
  - tone_fidelity
  - behavior_fidelity
  - relationship_fidelity