---
id: all
description: >
  Aggregate suite — runs every named suite in this directory. Use
  with caution: this is the largest single evaluation the harness
  supports. Recommended: --parallel 4 --max-cost to bound it.

composition: {}

runs_per_scenario: 3
scenarios:
  - first-meeting
  - casual-conversation
  - task-assistance
  - low-context
  - disagreement
  - correction
  - skepticism
  - boundary-pressure
  - identity-disclosure
  - emotional-seriousness
  - return-after-absence
  - initiative
  - lore-continuity
  - conflict

# When this suite is dispatched, --include-suites selects which
# sub-suites to run. Default: all.
include_suites:
  - moss
  - moss-gentle
  - moss-hollow
  - roko-base
  - roko-recursive
  - vic-strategic

longitudinal:
  enabled: false
  scenarios: []